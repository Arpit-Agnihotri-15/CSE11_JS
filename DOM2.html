<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Combined</title>
</head>
<body>

    <h1>DOM Manipulation</h1>

    <!-- First List -->
    <ul id="myList">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!-- Second List -->
    <ul>
        <li>Item 4</li>
        <li>Item 5</li>
        <li>Item 6</li>
        <li>Item 7</li>
        <li>Item 8</li>
        <li>Item 9</li>
        <li>Item 10</li>
    </ul>

    <!-- Elements -->
    <h1 id="demo">The Element Object</h1>

    <h1 id="myH1" class="myClass">Heading</h1>
    <p id="myP" class="myClass">The element object</p>

    <!-- Buttons -->
    <button onclick="myFunction()">Change Class (demo)</button>
    <button onclick="changeHeading()">Change Heading Class</button>
    <button onclick="updateHeading()">Update Heading Text</button>

    <!-- Script -->
    <script src="DOM2.js"></script>

</body>
</html>
