<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling</title>
</head>
<body>

    <button onclick="handleClick()">Click Me</button>
    <br><br>

    <button onmouseover="handleMouseOver()">Hover Me</button>
    <br><br>

    <button onmouseout="handleMouseOut()">Mouse Out</button>
    <br><br>

    <button onmousedown="handleMouseDown()">Mouse Down</button>
    <br><br>

    <button onmouseup="handleMouseUp()">Mouse Up</button>
    <br><br>

    <button onmousemove="handleMouseMove()">Move Mouse Over Me</button>
    <br><br>
    

    <p id="output">Event output will appear here</p>

    <script src="DOM3.js"></script>

</body>
</html>
